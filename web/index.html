<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>東京の鉄道空白地帯</title>
  <meta name="description" content="どの駅からも歩いて20分を超える所 (鉄道空白地帯) を地図にしました。東京の鉄道空白地帯の一覧と、大江戸線延伸の前後比較。">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%236a3fa0%22/%3E%3Ctext x=%228%22 y=%2211.5%22 font-size=%2210%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3E!%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <aside id="sheet" aria-label="鉄道空白地帯の一覧">
    <button id="sheet-handle" type="button" aria-expanded="false" aria-controls="sheet-body">
      <span class="grip" aria-hidden="true"></span><span id="sheet-title">鉄道空白地帯</span>
    </button>
    <div id="sheet-body">
      <header>
        <h1 id="page-title">東京の鉄道空白地帯</h1>
        <nav id="regions" class="regions" aria-label="地域"></nav>
        <p class="lead">色の付いた所が駅の徒歩圏 (駅まで歩いて 20 分以内)。<strong>色の付いていない灰色の所</strong>が、どの駅の徒歩圏にも入らない鉄道空白地帯です。区市町村ごとに区切って番号を付けています。</p>
        <form id="search-form" role="search" autocomplete="off">
          <input id="search" type="search" placeholder="町丁目・駅名で探す" aria-label="町丁目・駅名で探す">
          <button id="locate" type="button" title="現在地">現在地</button>
          <ul id="search-results" role="listbox"></ul>
        </form>
        <p class="privacy">検索と現在地はブラウザの中だけで使い、どこにも送りません。</p>
      </header>
      <section id="feature" aria-label="特集" hidden></section>
      <ol id="list"></ol>
      <details class="notes">
        <summary>この地図の限界と出典</summary>
        <div id="notes"></div>
      </details>
    </div>
  </aside>
  <main id="map" aria-label="地図">
    <!-- legend and the info box stack in one corner, so the eye stays in one place -->
    <div id="overlay">
      <div id="ctl" class="float">
        <div class="legend-title">凡例</div>
        <div id="legend"></div>
      </div>
      <div id="info" class="float" hidden aria-live="polite"></div>
    </div>
    <div id="error" class="float error" role="alert" hidden></div>
  </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
